plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.calendario'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.calendario'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para o APK ser instalável direto.
            // Para publicar na Google Play, troque por uma chave sua.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
